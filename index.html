<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>중앙멤버스클럽 판매 현황 | 비솔본부</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fafaf7;
    --bg-soft: #f3f3ee;
    --bg-card: #ffffff;
    --bg-elevated: #f7f7f2;
    --border: #e4e2da;
    --border-soft: #ececdf;
    --text: #1a1d24;
    --text-soft: #4a4f5c;
    --text-mute: #8a8f9c;
    --accent: #8b6f3f;
    --accent-soft: #8b6f3f15;
    --gold: #b8945f;
    --green: #3d8a5a;
    --green-soft: #3d8a5a15;
    --amber: #b8801f;
    --amber-soft: #b8801f15;
    --red: #b14545;
    --red-soft: #b1454515;
    --blue: #4a78a8;
    --blue-soft: #4a78a815;
    --purple: #7a5a9e;
    --purple-soft: #7a5a9e15;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'IBM Plex Sans KR', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    max-width: 1400px;
    margin: 0 auto;
    padding: 48px 32px 80px;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    padding-bottom: 28px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 36px;
    flex-wrap: wrap;
    gap: 20px;
  }

  .brand-mark {
    display: flex;
    align-items: center;
    gap: 12px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-mute);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  .brand-mark::before {
    content: '';
    width: 8px;
    height: 8px;
    background: var(--accent);
    border-radius: 50%;
  }

  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 42px;
    letter-spacing: -0.02em;
    line-height: 1.1;
    color: var(--text);
  }

  h1 em {
    font-style: italic;
    font-weight: 400;
    color: var(--accent);
  }

  .meta {
    text-align: right;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--text-mute);
    line-height: 1.8;
  }

  .meta strong {
    color: var(--text-soft);
    font-weight: 500;
  }

  .refresh-btn {
    margin-top: 8px;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-mute);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    padding: 5px 12px;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.15s ease;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .refresh-btn:hover {
    color: var(--accent);
    border-color: var(--accent);
  }

  .refresh-btn.loading {
    opacity: 0.5;
    pointer-events: none;
  }

  .refresh-btn.loading::before {
    content: '';
    width: 10px;
    height: 10px;
    border: 1.5px solid var(--text-mute);
    border-top-color: transparent;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .summary {
    display: grid;
    grid-template-columns: 1fr;
    gap: 16px;
    margin-bottom: 48px;
  }

  .summary-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 24px 28px;
    position: relative;
  }

  .summary-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 3px;
    background: var(--accent);
    border-radius: 14px 14px 0 0;
  }

  .summary-card.wc::before { background: var(--blue); }
  .summary-card.leaders::before { background: var(--purple); }

  .summary-title {
    font-family: 'Fraunces', serif;
    font-size: 20px;
    font-weight: 600;
    margin-bottom: 18px;
    letter-spacing: -0.01em;
  }

  .summary-stats {
    display: flex;
    gap: 24px;
    flex-wrap: wrap;
  }

  .stat {
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-width: 84px;
  }

  .stat-label {
    font-size: 11px;
    color: var(--text-mute);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-weight: 500;
  }

  .stat-value {
    font-family: 'IBM Plex Sans KR', -apple-system, sans-serif;
    font-size: 26px;
    font-weight: 700;
    line-height: 1.1;
    letter-spacing: -0.02em;
  }

  .stat-value .unit {
    font-size: 13px;
    color: var(--text-mute);
    margin-left: 3px;
    font-weight: 400;
  }

  .stat-value .amount {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--green);
    margin-left: 6px;
    font-weight: 500;
  }

  .stat.confirmed .stat-value { color: var(--green); }
  .stat.likely .stat-value { color: #5a9d76; }
  .stat.review .stat-value { color: var(--amber); }
  .stat.shortfall .stat-value { color: var(--red); }
  .stat.dropped .stat-value { color: #9a9488; }

  /* 그룹 구분선 - 다음 stat들을 새 줄로 밀어냄 */
  .stat-divider {
    flex-basis: 100%;
    height: 1px;
    background: var(--border-soft);
    margin: 6px 0 2px;
  }

  /* 멤버스클럽 요약 매트릭스 표 */
  /* 멤버스 테이블 - 한 줄 고정, 좁은 컬럼 줄바꿈 방지 */
  #leaders-table.leaders-fixed { table-layout: fixed; }
  #leaders-table.leaders-fixed td,
  #leaders-table.leaders-fixed th {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  /* 광고주는 좀 길어도 표시 (줄바꿈은 막되 잘리면 ellipsis) */
  #leaders-table.leaders-fixed td.advertiser { white-space: nowrap; }

  /* 매트릭스 표 */
  .summary-stats.has-matrix {
    display: block;
  }

  .matrix-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }

  .matrix-table thead th {
    padding: 6px 12px;
    text-align: right;
    font-size: 11px;
    font-weight: 600;
    color: var(--text-mute);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    border-bottom: 1px solid var(--border);
  }

  .matrix-table thead th:first-child {
    text-align: left;
  }

  .matrix-table thead th.c-confirmed { color: var(--green); }
  .matrix-table thead th.c-likely { color: #5a9d76; }
  .matrix-table thead th.c-proposed { color: var(--amber); }
  .matrix-table thead th.c-dropped { color: #9a9488; }

  .matrix-table tbody th {
    padding: 9px 12px;
    text-align: left;
    font-weight: 600;
    color: var(--text);
    font-size: 13px;
    border-bottom: 1px solid var(--border-soft);
  }

  .matrix-table tbody tr:last-child th,
  .matrix-table tbody tr:last-child td {
    border-bottom: none;
  }

  .matrix-table tbody tr.mx-total th,
  .matrix-table tbody tr.mx-total td {
    background: var(--bg-soft);
  }

  .matrix-table td.mx-num {
    padding: 9px 12px;
    text-align: right;
    font-family: 'IBM Plex Sans KR', sans-serif;
    font-variant-numeric: tabular-nums;
    font-weight: 600;
    font-size: 15px;
    color: var(--text-soft);
    border-bottom: 1px solid var(--border-soft);
  }

  .matrix-table td.mx-num.strong { color: var(--text); font-weight: 700; }
  .matrix-table td.mx-num.c-confirmed { color: var(--green); }
  .matrix-table td.mx-num.c-likely { color: #5a9d76; }
  .matrix-table td.mx-num.c-proposed { color: var(--amber); }
  .matrix-table td.mx-num.c-dropped { color: #9a9488; }

  section.product {
    margin-bottom: 56px;
  }

  .section-head {
    display: flex;
    align-items: baseline;
    gap: 16px;
    margin-bottom: 20px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }

  .section-num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--accent);
    background: var(--accent-soft);
    padding: 4px 10px;
    border-radius: 6px;
    font-weight: 600;
    letter-spacing: 0.05em;
  }

  .section-title {
    font-family: 'Fraunces', serif;
    font-size: 28px;
    font-weight: 500;
    letter-spacing: -0.015em;
  }

  .section-sub {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-mute);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-left: auto;
  }

  .panel {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
  }

  .panel-meta {
    padding: 16px 24px;
    background: var(--bg-soft);
    border-bottom: 1px solid var(--border-soft);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    font-size: 12.5px;
    color: var(--text-soft);
  }

  .panel-meta strong {
    color: var(--text);
    font-weight: 600;
  }

  .panel-meta .pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    padding: 4px 10px;
    border-radius: 6px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11.5px;
    color: var(--text);
  }

  .panel-meta .pill .key {
    color: var(--text-mute);
  }

  /* 부족분 - 빨간색 강조 */
  .panel-meta .pill.shortfall {
    background: var(--red-soft);
    border-color: var(--red);
    color: var(--red);
  }
  .panel-meta .pill.shortfall .key { color: var(--red); opacity: 0.7; }

  /* 초과 달성 - 그린 */
  .panel-meta .pill.achieved {
    background: var(--green-soft);
    border-color: var(--green);
    color: var(--green);
  }
  .panel-meta .pill.achieved .key { color: var(--green); opacity: 0.7; }

  .table-scroll { overflow-x: auto; }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13.5px;
  }

  thead th {
    text-align: left;
    padding: 13px 16px;
    background: var(--bg-soft);
    color: var(--text-mute);
    font-weight: 600;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }

  thead th.num { text-align: right; }

  tbody tr {
    border-bottom: 1px solid var(--border-soft);
  }

  tbody tr:hover {
    background: var(--bg-elevated);
  }
  tbody tr:last-child { border-bottom: none; }

  tbody tr.internal { background: #faf6f8; }
  tbody tr.internal:hover { background: #f5eff2; }

  tbody td {
    padding: 13px 16px;
    color: var(--text-soft);
    vertical-align: middle;
  }

  tbody td.num {
    font-family: 'JetBrains Mono', monospace;
    text-align: right;
    color: var(--text);
    font-variant-numeric: tabular-nums;
    font-weight: 500;
  }

  tbody td.num.empty {
    color: var(--text-mute);
    font-weight: 400;
  }

  tbody td.advertiser {
    color: var(--text);
    font-weight: 600;
  }

  tbody td.package {
    color: var(--text-soft);
    font-size: 12.5px;
    max-width: 280px;
  }

  tbody td.team {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11.5px;
    color: var(--text-mute);
  }

  tfoot td {
    padding: 16px;
    background: var(--bg-soft);
    border-top: 2px solid var(--border);
    font-weight: 600;
    color: var(--text);
    font-size: 13px;
  }

  tfoot td.num {
    font-family: 'JetBrains Mono', monospace;
    text-align: right;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
    font-size: 14px;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    border-radius: 6px;
    font-size: 11.5px;
    font-weight: 500;
    white-space: nowrap;
  }

  .badge::before {
    content: '';
    width: 5px;
    height: 5px;
    border-radius: 50%;
  }

  .badge.confirmed { background: var(--green-soft); color: var(--green); }
  .badge.confirmed::before { background: var(--green); }

  /* 유력 - 옅은 그린 (확정에 가까운 느낌) */
  .badge.likely { background: rgba(61, 138, 90, 0.08); color: #5a9d76; }
  .badge.likely::before { background: #5a9d76; }

  /* 제안 - 베이지/뉴트럴 */
  .badge.proposed { background: var(--bg-soft); color: var(--text-soft); border: 1px solid var(--border); }
  .badge.proposed::before { background: var(--text-mute); }

  .badge.final-review { background: var(--blue-soft); color: var(--blue); }
  .badge.final-review::before { background: var(--blue); }

  .badge.review { background: var(--amber-soft); color: var(--amber); }
  .badge.review::before { background: var(--amber); }

  .badge.canceled { background: var(--red-soft); color: var(--red); }
  .badge.canceled::before { background: var(--red); }

  /* 드롭/불가 - 회색 (탈락) */
  .badge.dropped { background: #f0eeea; color: #9a9488; text-decoration: line-through; text-decoration-thickness: 1px; }
  .badge.dropped::before { background: #b5afa3; }

  .badge.internal { background: var(--purple-soft); color: var(--purple); }
  .badge.internal::before { background: var(--purple); }

  .badge.unknown { background: var(--bg-soft); color: var(--text-mute); }
  .badge.unknown::before { background: var(--text-mute); }

  .seat-block {
    padding: 22px 24px;
    background: linear-gradient(180deg, #fdfbf6 0%, #ffffff 100%);
    border-bottom: 1px solid var(--border-soft);
  }

  .seat-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 10px;
  }

  .seat-label {
    font-size: 13px;
    color: var(--text-soft);
    font-weight: 500;
  }

  .seat-value {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
  }

  .seat-value .target {
    color: var(--text-mute);
    font-weight: 400;
  }

  .seat-bar {
    height: 8px;
    background: var(--bg-soft);
    border-radius: 4px;
    overflow: hidden;
  }

  .seat-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--gold));
    border-radius: 4px;
    transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .seat-pct {
    margin-top: 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--accent);
    text-align: right;
  }

  /* Empty state */
  .empty-state {
    padding: 60px 24px;
    text-align: center;
    color: var(--text-mute);
  }

  .empty-icon {
    font-size: 36px;
    color: var(--purple);
    opacity: 0.6;
    margin-bottom: 14px;
    font-family: 'Fraunces', serif;
  }

  .empty-title {
    font-family: 'Fraunces', serif;
    font-size: 17px;
    font-weight: 500;
    color: var(--text-soft);
    margin-bottom: 6px;
  }

  .empty-desc {
    font-size: 13px;
    color: var(--text-mute);
    line-height: 1.6;
  }

  /* Loading state */
  .loading-overlay {
    position: fixed;
    inset: 0;
    background: rgba(250, 250, 247, 0.95);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 999;
  }

  .loading-overlay.hidden {
    display: none;
  }

  .loading-spinner {
    width: 40px;
    height: 40px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  .loading-text {
    margin-top: 16px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--text-mute);
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  .loading-content {
    text-align: center;
  }

  /* Error state */
  .error-banner {
    background: var(--red-soft);
    border: 1px solid var(--red);
    color: var(--red);
    padding: 14px 20px;
    border-radius: 10px;
    margin-bottom: 24px;
    font-size: 13px;
  }

  .error-banner strong { font-weight: 600; }

  @media (max-width: 1100px) {
    .summary { grid-template-columns: repeat(2, 1fr); }
  }

  @media (max-width: 800px) {
    .wrap { padding: 28px 16px 60px; }
    h1 { font-size: 28px; }
    .section-title { font-size: 22px; }
    .summary { grid-template-columns: 1fr; }
    .meta { text-align: left; }
    header { align-items: flex-start; }
  }
</style>
</head>
<body>

<!-- 로딩 오버레이 -->
<div class="loading-overlay" id="loading">
  <div class="loading-content">
    <div class="loading-spinner"></div>
    <div class="loading-text">데이터 로딩 중</div>
  </div>
</div>

<div class="wrap">

  <header>
    <div>
      <div class="brand-mark">JoongAng Ilbo · 비즈솔루션본부</div>
      <h1>중앙멤버스클럽 <em>판매 현황</em></h1>
    </div>
    <div class="meta">
      <strong>2026. 6</strong><br>
      <span id="updated-at">로딩 중...</span><br>
      <button class="refresh-btn" id="refresh-btn" onclick="loadData()">새로고침</button>
    </div>
  </header>

  <div id="error-container"></div>

  <!-- ============ 상단 요약 ============ -->
  <div class="summary">
    <div class="summary-card leaders">
      <div class="summary-stats has-matrix" id="leaders-summary">
        <div class="stat"><span class="stat-label">전체</span><span class="stat-value">-</span></div>
      </div>
    </div>
  </div>

  <!-- ============ 중앙멤버스클럽 ============ -->
  <section class="product">
    <div class="section-head">
      <h2 class="section-title">중앙멤버스클럽</h2>
      <span class="section-sub">확정 · 유력 광고주 목록 · 천원 단위</span>
    </div>

    <div class="panel">
      <div class="panel-meta">
        <div>
          <strong>제안 패키지</strong> 스탠다드 / 프리미엄
        </div>
        <div id="leaders-pipeline"></div>
      </div>
      <div id="leaders-content"></div>
    </div>
  </section>

</div>

<script>
  // ===== GAS Web App URL =====
  // 배포 후 발급받은 URL을 여기에 붙여넣으세요
  const GAS_URL = 'https://script.google.com/macros/s/AKfycbyP0mybcCfcpnSreGXPKhWoavdWuzvWgXBdS88uhrNkmnMnLp0sTcnpwCQe7nJqNvLh/exec';

  // ===== Helpers =====
  const fmt = n => Number(n || 0).toLocaleString('ko-KR');

  // 상황 텍스트 → 뱃지 클래스 매핑
  function statusClass(label) {
    if (!label) return 'unknown';
    const s = String(label).trim();

    // 정확한 단어 매칭 우선
    if (s === '확정' || s === '진행 확정' || s.startsWith('계산서')) return 'confirmed';
    if (s === '유력') return 'likely';
    if (s === '제안') return 'proposed';
    if (s === '검토' || s === '검토중') return 'review';
    if (s === '드롭' || s === '드랍' || s === '불가' || s === '미집행' || s === '취소') return 'dropped';

    // '검토' 키워드가 들어간 긴 텍스트 (예: '제안서 전달 및 검토 중')
    if (s.includes('검토')) return 'review';

    // 내부 활용 (임윤찬 내부 VIP용)
    if (s === '확정 (내부)' || s === '내부 활용' || s === '내부 VIP용') return 'internal';

    // 최종 협의
    if (s === '최종 협의 중' || s === '최종협의중') return 'final-review';

    // 미집행/취소
    if (s === '미집행' || s === '취소' || s === '드랍') return 'canceled';

    // 협의 (오래된 임윤찬 상태값)
    if (s === '협의 중' || s === '협의중' || s === '미정') return 'review';

    // 그 외 분류되지 않은 텍스트는 review로 (안전)
    return 'review';
  }

  // 상황 → 카테고리 (요약 카운트용)
  function statusBucket(label) {
    const cls = statusClass(label);
    if (cls === 'confirmed' || cls === 'internal') return 'confirmed';
    return 'pending';
  }

  // ===== 메인 =====
  async function loadData() {
    const refreshBtn = document.getElementById('refresh-btn');
    const errorContainer = document.getElementById('error-container');
    refreshBtn.classList.add('loading');
    errorContainer.innerHTML = '';

    if (GAS_URL === 'YOUR_GAS_URL_HERE') {
      showError('GAS_URL이 설정되지 않았습니다. HTML 파일을 열어 GAS_URL 상수에 배포된 웹 앱 URL을 붙여넣으세요.');
      document.getElementById('loading').classList.add('hidden');
      refreshBtn.classList.remove('loading');
      return;
    }

    try {
      const res = await fetch(GAS_URL);
      const data = await res.json();

      if (data.error) throw new Error(data.error);

      renderLeaders(data.leaders);

      // updated 시각
      const updated = new Date(data.updatedAt);
      document.getElementById('updated-at').textContent =
        'Updated ' + updated.toLocaleString('ko-KR', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });

      document.getElementById('loading').classList.add('hidden');
    } catch (err) {
      showError('데이터를 불러오는 중 오류가 발생했습니다: ' + err.message);
      document.getElementById('loading').classList.add('hidden');
    } finally {
      refreshBtn.classList.remove('loading');
    }
  }

  function showError(msg) {
    document.getElementById('error-container').innerHTML =
      `<div class="error-banner"><strong>오류</strong> · ${msg}</div>`;
  }

  // ===== 중앙리더스클럽 렌더 =====
  function renderLeaders(leaders) {
    if (!leaders) return;
    const items = leaders.items || [];

    // 4단계 분류
    const clsOf = (d) => statusClass(d.statusLabel);
    const isConfirmed = (d) => { const c = clsOf(d); return c === 'confirmed' || c === 'internal'; };
    const isLikely    = (d) => clsOf(d) === 'likely';
    const isDropped   = (d) => clsOf(d) === 'dropped' || clsOf(d) === 'canceled';
    const isProposed  = (d) => { const c = clsOf(d); return c === 'proposed' || c === 'review' || c === 'final-review'; };

    const total     = items.length;
    const confirmed = items.filter(isConfirmed);
    const likely    = items.filter(isLikely);
    const proposed  = items.filter(isProposed);
    const dropped   = items.filter(isDropped);

    const confirmedAmt = confirmed.reduce((s, d) => s + (Number(d.price) || 0), 0);
    const likelyAmt    = likely.reduce((s, d) => s + (Number(d.price) || 0), 0);
    const totalAmt     = items.reduce((s, d) => s + (Number(d.price) || 0), 0);

    // 그룹별 (마솔국 / 콘사국) - 드롭 제외한 유효 건수
    const groupOf = (d) => {
      const g = String(d.group || '').trim();
      if (g.indexOf('마솔') !== -1) return '마솔국';
      if (g.indexOf('콘사') !== -1) return '콘사국';
      return '기타';
    };
    const masol = items.filter(d => groupOf(d) === '마솔국');
    const consa = items.filter(d => groupOf(d) === '콘사국');

    // 정렬: 확정 → 유력 → 제안 → 드롭 순
    const sorted = [...confirmed, ...likely, ...proposed, ...dropped,
                    ...items.filter(d => !isConfirmed(d) && !isLikely(d) && !isProposed(d) && !isDropped(d))];

    // 국별 x 상태별 집계 함수
    const countBy = (arr, pred) => arr.filter(pred).length;
    const buildRow = (arr) => ({
      total: arr.length,
      confirmed: countBy(arr, isConfirmed),
      likely: countBy(arr, isLikely),
      proposed: countBy(arr, isProposed),
      dropped: countBy(arr, isDropped)
    });
    const rowAll   = buildRow(items);
    const rowMasol = buildRow(masol);
    const rowConsa = buildRow(consa);

    const cell = (v, cls) => `<td class="mx-num ${cls || ''}">${v}</td>`;
    document.getElementById('leaders-summary').innerHTML = `
      <table class="matrix-table">
        <thead>
          <tr>
            <th></th>
            <th>전체</th>
            <th class="c-confirmed">확정</th>
            <th class="c-likely">유력</th>
            <th class="c-proposed">제안</th>
            <th class="c-dropped">드롭</th>
          </tr>
        </thead>
        <tbody>
          <tr class="mx-total">
            <th>전체</th>
            ${cell(rowAll.total,'strong')}${cell(rowAll.confirmed,'c-confirmed')}${cell(rowAll.likely,'c-likely')}${cell(rowAll.proposed,'c-proposed')}${cell(rowAll.dropped,'c-dropped')}
          </tr>
          <tr>
            <th>마솔국</th>
            ${cell(rowMasol.total,'strong')}${cell(rowMasol.confirmed,'c-confirmed')}${cell(rowMasol.likely,'c-likely')}${cell(rowMasol.proposed,'c-proposed')}${cell(rowMasol.dropped,'c-dropped')}
          </tr>
          <tr>
            <th>콘사국</th>
            ${cell(rowConsa.total,'strong')}${cell(rowConsa.confirmed,'c-confirmed')}${cell(rowConsa.likely,'c-likely')}${cell(rowConsa.proposed,'c-proposed')}${cell(rowConsa.dropped,'c-dropped')}
          </tr>
        </tbody>
      </table>
    `;

    document.getElementById('leaders-pipeline').innerHTML = total > 0
      ? `<strong>총 ${total}건</strong> · 확정 ${(confirmedAmt/100000).toFixed(2)}억 · 유력 ${(likelyAmt/100000).toFixed(2)}억`
      : `<strong>제안 0건</strong> · 데이터 입력 대기`;

    const container = document.getElementById('leaders-content');

    if (items.length === 0) {
      container.innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">◷</div>
          <div class="empty-title">제안 데이터 입력 대기 중</div>
          <div class="empty-desc">시트에 광고주별 제안 정보가 입력되면 이 영역에 자동으로 표시됩니다.</div>
        </div>
      `;
      return;
    }

    // 테이블에는 확정/유력만 표시 (제안/드롭은 요약 매트릭스 표로만)
    const tableItems = [...confirmed, ...likely];
    const tableTotalAmt = tableItems.reduce((s, d) => s + (Number(d.price) || 0), 0);

    container.innerHTML = `
      <div class="table-scroll">
        <table id="leaders-table" class="leaders-fixed">
          <colgroup>
            <col style="width:40px">
            <col style="width:80px">
            <col style="width:80px">
            <col style="min-width:200px">
            <col style="width:80px">
            <col style="min-width:160px">
            <col style="width:100px">
            <col>
          </colgroup>
          <thead>
            <tr>
              <th>#</th>
              <th>현황</th>
              <th>구분</th>
              <th>광고주</th>
              <th>담당자</th>
              <th>패키지</th>
              <th class="num">금액</th>
              <th>비고</th>
            </tr>
          </thead>
          <tbody></tbody>
          <tfoot>
            <tr>
              <td colspan="6">확정 + 유력 합계 (${tableItems.length}건)</td>
              <td class="num">${fmt(tableTotalAmt)}</td>
              <td></td>
            </tr>
          </tfoot>
        </table>
      </div>
    `;

    const tbody = container.querySelector('tbody');
    tableItems.forEach((d, i) => {
      const cls = statusClass(d.statusLabel);
      const displayLabel = (d.statusLabel === '제안') ? '제안중' : (d.statusLabel || '-');
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td style="color:var(--text-mute)">${i + 1}</td>
        <td><span class="badge ${cls}">${displayLabel}</span></td>
        <td class="team">${d.group || '-'}</td>
        <td class="advertiser" title="${d.adv}">${d.adv}</td>
        <td>${d.mgr || '-'}</td>
        <td class="package" title="${d.pkg || ''}">${d.pkg || '-'}</td>
        <td class="num ${d.price ? '' : 'empty'}">${d.price ? fmt(d.price) : '-'}</td>
        <td title="${d.note || ''}" style="color:var(--text-mute);font-size:12px">${d.note || ''}</td>
      `;
      tbody.appendChild(tr);
    });
  }

  // 초기 로드
  loadData();
</script>
</body>
</html>
