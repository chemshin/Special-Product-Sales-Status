<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>광고주 인텔리전스 · 비즈솔루션본부</title>
<style>
:root{
  --brand:#F6520A; --brand-deep:#FF3C13; --brand-tint:#FFF3ED;
  --ink:#1B1B1F; --ink-soft:#55555E; --ink-faint:#9A9AA3;
  --paper:#F7F6F3; --card:#FFFFFF; --line:#E8E6E1;
  --fact:#2B2B33; --ai-line:#F6520A;
  --win:#0E8A4A; --lose:#C0392B; --pend:#B07800;
  --radius:14px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic",sans-serif;
  background:var(--paper);color:var(--ink);line-height:1.55;
  max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:60px;
}
.topbar{position:sticky;top:0;z-index:50;background:var(--ink);color:#fff;padding:14px 18px 12px}
.topbar .org{font-size:11px;letter-spacing:.14em;color:var(--brand);font-weight:700}
.topbar h1{font-size:17px;font-weight:800;letter-spacing:-.02em;margin-top:1px}
.searchwrap{position:relative;margin-top:12px}
.searchwrap input{width:100%;padding:12px 14px 12px 40px;border:none;border-radius:10px;font-size:15px;background:#2A2A31;color:#fff;outline:none}
.searchwrap input::placeholder{color:#7A7A85}
.searchwrap input:focus{box-shadow:0 0 0 2px var(--brand)}
.searchwrap .icon{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:16px;height:16px;fill:none;stroke:#8A8A94;stroke-width:2.2}
.suggest{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--card);border-radius:10px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.22);display:none}
.suggest.show{display:block}
.suggest button{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;padding:12px 14px;border:none;background:none;text-align:left;font-size:14px;color:var(--ink);cursor:pointer;border-bottom:1px solid var(--line)}
.suggest button:last-child{border-bottom:none}
.suggest button:active{background:var(--brand-tint)}
.suggest .alias{font-size:12px;color:var(--ink-faint)}

.landing{padding:22px 18px}
.landing .mark{font-size:11px;letter-spacing:.12em;color:var(--ink-faint);font-weight:700;margin-bottom:10px}
.landing .chips{display:flex;flex-wrap:wrap;gap:8px}
.landing .chips button{padding:9px 15px;border:1px solid var(--line);border-radius:999px;background:var(--card);font-size:13.5px;font-weight:600;color:var(--ink);cursor:pointer}
.landing .chips button:active{border-color:var(--brand);color:var(--brand)}
.landing .ai-notice{font-size:11.5px;color:var(--ink-faint);margin-top:16px;line-height:1.5}
.landing .err{margin-top:14px;font-size:13px;color:var(--lose);display:none}

.loading{padding:70px 30px;text-align:center;display:none}
.loading.show{display:block}
.loading .name{font-size:20px;font-weight:800;margin-bottom:26px}
.steps{display:flex;flex-direction:column;gap:14px;max-width:280px;margin:0 auto;text-align:left}
.step{display:flex;align-items:center;gap:11px;font-size:14px;color:var(--ink-faint);transition:color .3s}
.step .dot{flex:none;width:18px;height:18px;border-radius:50%;border:2px solid var(--line);transition:all .3s;position:relative}
.step.active{color:var(--ink);font-weight:600}
.step.active .dot{border-color:var(--brand)}
.step.active .dot::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--brand);animation:pulse 1s infinite}
.step.done{color:var(--ink-soft)}
.step.done .dot{border-color:var(--win);background:var(--win)}
.step.done .dot::after{content:"✓";position:absolute;inset:0;color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center}
@keyframes pulse{50%{opacity:.35}}

.report{display:none;padding:0 16px}
.report.show{display:block}
.dossier{background:var(--ink);color:#fff;border-radius:0 0 var(--radius) var(--radius);margin:0 -16px 18px;padding:22px 22px 20px}
.dossier .cat{font-size:11px;letter-spacing:.12em;color:var(--brand);font-weight:700}
.dossier h2{font-size:28px;font-weight:800;letter-spacing:-.03em;margin:3px 0 2px}
.dossier .aliases{font-size:12px;color:#9A9AA3;margin-bottom:16px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:#2A2A31;border-radius:10px;padding:10px 12px}
.kpi .v{font-size:15px;font-weight:800;letter-spacing:-.02em;line-height:1.25;word-break:keep-all}
.kpi .k{font-size:10.5px;color:#8A8A94;margin-top:1px}
.kpi .v .grade{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:26px;border-radius:8px;padding:0 7px;font-size:15px;font-weight:800;color:#fff}
.grade.gS{background:var(--brand)} .grade.gA{background:#3A6EA5} .grade.gB{background:#6B7280} .grade.gD{background:#B07800}
.kpi .gl{font-size:10px;color:#B8B8C0;margin-left:5px}

.sec{background:var(--card);border-radius:var(--radius);border:1px solid var(--line);padding:16px 16px 14px;margin-bottom:14px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:12px}
.sec-h .no{font-size:11px;font-weight:800;color:var(--ink-faint);letter-spacing:.06em}
.sec-h h3{font-size:15px;font-weight:800;letter-spacing:-.01em;display:inline}
.tag-fact{font-size:10.5px;font-weight:700;color:var(--ink-soft);background:var(--paper);border:1px solid var(--line);padding:2px 8px;border-radius:999px}
.tag-ai{font-size:10.5px;font-weight:700;color:var(--brand-deep);background:var(--brand-tint);border:1px solid #FBD0BC;padding:2px 8px;border-radius:999px}
.sec.ai{border:1.5px dashed var(--ai-line);background:linear-gradient(180deg,#FFFBF9 0%,#fff 100%)}
.empty{font-size:12.5px;color:var(--ink-faint);padding:6px 0}

.exec-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.exec-row:last-child{border-bottom:none}
.exec-row .m{font-size:14px;font-weight:700}
.exec-row .p{font-size:12px;color:var(--ink-faint)}
.exec-row .amt{font-size:14.5px;font-weight:800;letter-spacing:-.01em;text-align:right}
.exec-sum{display:flex;justify-content:space-between;margin-top:10px;padding-top:11px;border-top:2px solid var(--ink);font-size:13.5px;font-weight:800}

.tl{position:relative;padding-left:20px}
.tl::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl-item{position:relative;padding-bottom:16px}
.tl-item:last-child{padding-bottom:2px}
.tl-item::before{content:"";position:absolute;left:-19px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--card);border:2.5px solid var(--fact)}
.tl-item .d{font-size:11.5px;font-weight:700;color:var(--ink-faint)}
.tl-item .d .src{font-weight:600;color:var(--brand);margin-left:6px}
.tl-item .b{font-size:13.5px;margin-top:2px;white-space:pre-line}

.comp-row{padding:11px 0;border-bottom:1px solid var(--line)}
.comp-row:last-child{border-bottom:none}
.comp-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.comp-top .media{font-size:14px;font-weight:700}
.comp-top .mo{font-size:11.5px;color:var(--ink-faint)}
.comp-sub{font-size:12.5px;color:var(--ink-soft);margin-top:2px}

.news{padding:11px 0;border-bottom:1px solid #F3E4DB}
.news:last-child{border-bottom:none}
.news .h{font-size:13.5px;font-weight:700;line-height:1.45}
.news .meta{font-size:11.5px;color:var(--ink-faint);margin-top:3px}
.news .sum{font-size:12.5px;color:var(--ink-soft);margin-top:4px}

.insight-lead{font-size:14.5px;font-weight:700;line-height:1.6;letter-spacing:-.01em;padding:12px 14px;background:var(--ink);color:#fff;border-radius:10px;margin-bottom:12px}
.act{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid #F3E4DB;font-size:13px}
.act:last-child{border-bottom:none}
.act .n{flex:none;width:19px;height:19px;border-radius:6px;background:var(--brand);color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:2px}
.act b{letter-spacing:-.01em}
.act .d2{font-size:12.5px;color:var(--ink-soft);margin-top:1px}
.disclaimer{font-size:11px;color:var(--ink-faint);margin-top:12px;padding-top:10px;border-top:1px dashed #F0D9CC;line-height:1.5}

.confirm-card{text-align:center;padding:10px 6px 4px}
.confirm-card .ct{font-size:14.5px;font-weight:800;letter-spacing:-.01em}
.confirm-card .cd{font-size:12.5px;color:var(--ink-soft);margin:8px 0 14px;line-height:1.6}
.confirm-card .cd b{color:var(--brand-deep)}
.confirm-btn{padding:12px 26px;border:none;border-radius:10px;background:var(--brand);color:#fff;font-size:14px;font-weight:800;cursor:pointer}
.confirm-btn:active{background:var(--brand-deep)}

.yr-h{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:800;color:var(--brand-deep);background:var(--brand-tint);border-radius:7px;padding:5px 10px;margin:10px 0 2px}
.yr-h:first-child{margin-top:0}

.back{display:block;width:100%;margin:6px 0 20px;padding:13px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-size:14px;font-weight:700;color:var(--ink);cursor:pointer}
.pdf-btn{display:block;width:100%;margin:0 0 8px;padding:13px;border:none;border-radius:10px;background:var(--ink);font-size:14px;font-weight:700;color:#fff;cursor:pointer}
.gen-time{font-size:11px;color:var(--ink-faint);text-align:center;margin-bottom:14px}

@media print{
  body{max-width:none;background:#fff;padding:0}
  .topbar,.pdf-btn,.back{display:none!important}
  .report{padding:0 4mm}
  .dossier{margin:0 0 14px;border-radius:10px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .sec{break-inside:avoid;box-shadow:none}
  .sec.ai{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .kpi,.grade,.yr-h,.tag-ai,.tag-fact,.insight-lead{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="org">JOONGANG · 비즈솔루션본부</div>
  <h1>광고주 인텔리전스</h1>
  <div class="searchwrap">
    <svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
    <input id="q" type="text" placeholder="광고주명 입력" autocomplete="off">
    <div class="suggest" id="suggest"></div>
  </div>
</div>

<div class="landing" id="landing">
  <div class="mark">최근 조회</div>
  <div class="chips" id="recentChips"></div>
  <p class="ai-notice">리포트 일부는 AI가 생성한 내용으로, 부정확하거나 실제와 다른 정보가 포함될 수 있습니다.</p>
  <p class="err" id="errMsg"></p>
</div>

<div class="loading" id="loading">
  <div class="name" id="loadName"></div>
  <div class="steps">
    <div class="step" id="s1"><span class="dot"></span>내부 데이터 취합 중</div>
    <div class="step" id="s2"><span class="dot"></span>최근 기사 검색 중 (Claude API)</div>
    <div class="step" id="s3"><span class="dot"></span>공략 인사이트 생성 중</div>
  </div>
</div>

<div class="report" id="report"></div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbwL_hT8TQiZ2DfyN6CbtST9vU1VNl2XUaNFel6atJD2zJAOybsO1BVHqowfBF-LOLSj/exec';
const GRADE_LABEL = { S:'핵심 유지', A:'성장 공략', B:'윈백', D:'신규 개척' };

const q = document.getElementById('q');
const suggest = document.getElementById('suggest');
const errMsg = document.getElementById('errMsg');

// ── 유틸 ──
function esc(s){const d=document.createElement('div');d.textContent=String(s==null?'':s);return d.innerHTML;}
function fmtWon(v){ // 원 단위 → 억/만원
  v = Number(v)||0;
  if(v>=1e8) return (v/1e8).toFixed(v%1e8===0?0:1).replace(/\.0$/,'')+'억';
  if(v>=1e4) return Math.round(v/1e4).toLocaleString()+'만원';
  return v.toLocaleString()+'원';
}
function fmtManwon(v){ return fmtWon((Number(v)||0)*1e4); } // 만원 단위 입력
function getRecent(){ try{ return JSON.parse(localStorage.getItem('advRecent')||'[]'); }catch(e){ return []; } }
function pushRecent(name){
  try{
    let r = getRecent().filter(x=>x!==name); r.unshift(name);
    localStorage.setItem('advRecent', JSON.stringify(r.slice(0,6)));
  }catch(e){}
}
function renderChips(){
  const r = getRecent();
  document.getElementById('recentChips').innerHTML =
    (r.length? r : ['미우미우','올리브영','디아지오코리아'])
    .map(n=>`<button onclick="run('${esc(n)}')">${esc(n)}</button>`).join('');
}
renderChips();

// ── 자동완성 (디바운스) ──
let debounce=null;
q.addEventListener('input', ()=>{
  clearTimeout(debounce);
  const v=q.value.trim();
  if(!v){suggest.classList.remove('show');return;}
  debounce=setTimeout(async ()=>{
    try{
      const res=await fetch(`${API}?action=search&q=${encodeURIComponent(v)}`);
      const data=await res.json();
      if(!data.items||!data.items.length){suggest.classList.remove('show');return;}
      suggest.innerHTML=data.items.map(it=>{
        const tag = it.registered===false ? '마스터 미등록' : (it.matched?`"${esc(it.matched)}" 매칭`:'');
        return `<button onclick="run('${esc(it.name)}')"><b>${esc(it.name)}</b><span class="alias">${tag}</span></button>`;
      }).join('');
      suggest.classList.add('show');
    }catch(e){/* 무시 */}
  },300);
});
q.addEventListener('keydown',e=>{ if(e.key==='Enter'&&q.value.trim()) run(q.value.trim()); });

// ── 리포트 실행 ──
let stepTimers=[];
function setSteps(){
  ['s1','s2','s3'].forEach(s=>document.getElementById(s).className='step');
  stepTimers.forEach(clearTimeout); stepTimers=[];
  stepTimers.push(setTimeout(()=>document.getElementById('s1').classList.add('active'),100));
  stepTimers.push(setTimeout(()=>{const e=document.getElementById('s1');e.classList.remove('active');e.classList.add('done');document.getElementById('s2').classList.add('active');},900));
  stepTimers.push(setTimeout(()=>{const e=document.getElementById('s2');e.classList.remove('active');e.classList.add('done');document.getElementById('s3').classList.add('active');},6000));
}
async function run(name, force){
  suggest.classList.remove('show'); errMsg.style.display='none';
  q.value=name; q.blur();
  document.getElementById('landing').style.display='none';
  document.getElementById('report').classList.remove('show');
  const L=document.getElementById('loading');
  L.classList.add('show');
  document.getElementById('loadName').textContent=name+' 리포트 생성';
  setSteps();
  try{
    const res=await fetch(`${API}?action=report&adv=${encodeURIComponent(name)}${force?'&ai=force':''}`);
    const data=await res.json();
    if(data.error){ throw new Error(data.error); }
    stepTimers.forEach(clearTimeout);
    ['s1','s2','s3'].forEach(s=>{const e=document.getElementById(s);e.classList.remove('active');e.classList.add('done');});
    pushRecent(data.name);
    setTimeout(()=>{ L.classList.remove('show'); render(data); },350);
  }catch(err){
    stepTimers.forEach(clearTimeout);
    L.classList.remove('show');
    document.getElementById('landing').style.display='block';
    errMsg.textContent='⚠ '+err.message;
    errMsg.style.display='block';
    renderChips();
  }
}

// ── 렌더링 ──
function render(d){
  const R=document.getElementById('report');
  const now=new Date();
  const ts=`${now.getFullYear()}.${String(now.getMonth()+1).padStart(2,'0')}.${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  const g=(d.kpi&&d.kpi.grade)||'D';
  const execTotal=(d.exec||[]).reduce((s,e)=>s+(Number(e.amount)||0),0);

  let execHtml;
  if(d.exec&&d.exec.length){
    const byYear={};
    d.exec.forEach(e=>{const y=e.year||(e.from||'').slice(0,4)||'기타';(byYear[y]=byYear[y]||[]).push(e);});
    const years=Object.keys(byYear).sort((a,b)=>b.localeCompare(a));
    execHtml=years.map(y=>{
      const rows=byYear[y];
      const sub=rows.reduce((s,e)=>s+(Number(e.amount)||0),0);
      return `<div class="yr-h"><span>${esc(y)}년</span><span>${fmtWon(sub)}</span></div>`
        + rows.map(e=>`<div class="exec-row"><div><div class="m">${esc(e.media)}</div><div class="p">${esc(e.from)}${e.from!==e.to?' ~ '+esc(e.to):''}${e.owner?' · '+esc(e.owner):''}</div></div><div><div class="amt">${fmtWon(e.amount)}</div></div></div>`).join('');
    }).join('')
    + `<div class="exec-sum"><span>누적 집행</span><span>${fmtWon(execTotal)}</span></div>`;
  } else {
    execHtml=`<div class="empty">자사 집행 이력이 없습니다. (신규 개척 대상)</div>`;
  }

  const tlHtml=(d.timeline&&d.timeline.length)
    ? `<div class="tl">${d.timeline.map(t=>`<div class="tl-item"><div class="d">${esc(t.date)}<span class="src">${esc(t.src)}</span></div><div class="b">${esc(t.body)}</div></div>`).join('')}</div>`
    : `<div class="empty">영업일지·주간보고에 기록이 없습니다.</div>`;

  const compHtml=(d.competitors&&d.competitors.length)
    ? d.competitors.map(c=>`<div class="comp-row"><div class="comp-top"><span class="media">${esc(c.media)}</span><span class="mo">${esc(c.month)}${c.team?' · '+esc(c.team):''}</span></div><div class="comp-sub">${esc(c.campaign)}${c.detail?' · '+esc(c.detail):''}</div></div>`).join('')
    : `<div class="empty">경쟁매체 노출 기록이 없습니다.</div>`;

  const newsHtml=(d.news&&d.news.length)
    ? d.news.map(n=>`<div class="news"><div class="h">${esc(n.h)}</div><div class="meta">${esc(n.meta)}</div><div class="sum">${esc(n.sum)}</div></div>`).join('')
    : `<div class="empty">AI 이슈 검색 결과가 없습니다.</div>`;

  const ins=d.insight||{};
  const insHtml=
    (ins.lead?`<div class="insight-lead">${esc(ins.lead)}</div>`:'')
    +((ins.acts&&ins.acts.length)
      ? ins.acts.map((a,i)=>`<div class="act"><span class="n">${i+1}</span><div><b>${esc(a.b)}</b><div class="d2">${esc(a.d)}</div></div></div>`).join('')
      : `<div class="empty">인사이트 생성 결과가 없습니다.</div>`);

  const aiSections = d.needsAiConfirm
    ? `<div class="sec ai">
        <div class="sec-h"><div><span class="no">04·05</span> <h3>AI 웹 검색 리포트</h3></div><span class="tag-ai">실행 대기</span></div>
        <div class="confirm-card">
          <div class="ct">'${esc(d.name)}' 은(는) 내부 기록이 없는 광고주입니다.</div>
          <div class="cd">AI 웹 검색으로 브랜드 개요·최근 이슈·첫 제안 인사이트를 조사할 수 있습니다.<br>실행 시 <b>Claude API 비용이 발생</b>하니, 광고주명에 오타가 없는지 확인해 주세요.</div>
          <button class="confirm-btn" onclick="run('${esc(d.name)}',true)">AI 웹 검색 실행</button>
        </div>
      </div>`
    : `<div class="sec ai"><div class="sec-h"><div><span class="no">04</span> <h3>최근 이슈</h3></div><span class="tag-ai">AI 웹검색</span></div>${newsHtml}</div>
  <div class="sec ai"><div class="sec-h"><div><span class="no">05</span> <h3>공략 인사이트</h3></div><span class="tag-ai">AI 생성 · 참고용</span></div>${insHtml}
    <div class="disclaimer">⚠️ 04·05번은 AI가 웹검색과 내부 데이터를 바탕으로 생성한 참고 자료입니다. 광고주 미팅에서 인용하기 전 팩트 확인이 필요합니다.</div>
  </div>`;

  R.innerHTML=`
  <div class="dossier">
    <div class="cat">${esc(d.industry||'')}${d.parent?' · '+esc(d.parent):''}${d.owner?' · 담당 '+esc(d.owner):''}</div>
    <h2>${esc(d.name)}</h2>
    <div class="aliases">${d.noInternal?'🔍 내부 기록 없음 — 웹 검색 기반 신규 개척 리포트':(d.registered===false?'⚠ 마스터 미등록 — 원본 데이터 직접 조회 (별칭·업종 등록 권장)':(d.aliases?'별칭: '+esc(d.aliases):''))}</div>
    <div class="kpis">
      <div class="kpi"><div class="v">${fmtManwon(d.kpi&&d.kpi.total)}</div><div class="k">누적 집행${d.kpi&&d.kpi.lastMonth?' · 최근 '+esc(d.kpi.lastMonth):''}</div></div>
      <div class="kpi"><div class="v">${esc((d.kpi&&d.kpi.topMedia)||'—')}</div><div class="k">주요 매체</div></div>
      <div class="kpi"><div class="v"><span class="grade g${esc(g)}">${esc(g)}</span><span class="gl">${GRADE_LABEL[g]||''}</span></div><div class="k">거래 등급</div></div>
    </div>
  </div>

  <div class="sec"><div class="sec-h"><div><span class="no">01</span> <h3>매체 집행 내역</h3></div><span class="tag-fact">내부 기록</span></div>${execHtml}</div>
  <div class="sec"><div class="sec-h"><div><span class="no">02</span> <h3>영업 접점 타임라인</h3></div><span class="tag-fact">내부 기록</span></div>${tlHtml}</div>
  <div class="sec"><div class="sec-h"><div><span class="no">03</span> <h3>경쟁매체 노출 현황</h3></div><span class="tag-fact">내부 기록</span></div>${compHtml}</div>
  ${aiSections}

  <div class="gen-time">리포트 생성 ${ts}</div>
  <button class="pdf-btn" onclick="exportPdf('${esc(d.name)}')">PDF로 저장</button>
  <button class="back" onclick="reset()">← 다른 광고주 검색</button>`;
  R.classList.add('show');
  window.scrollTo({top:0});
}

function exportPdf(name){
  const orig=document.title;
  const now=new Date();
  document.title=`광고주리포트_${name}_${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}`;
  window.print();
  setTimeout(()=>{document.title=orig;},1000);
}

function reset(){
  document.getElementById('report').classList.remove('show');
  document.getElementById('landing').style.display='block';
  q.value=''; errMsg.style.display='none';
  renderChips();
  window.scrollTo({top:0});
}
document.addEventListener('click',e=>{ if(!e.target.closest('.searchwrap')) suggest.classList.remove('show'); });
</script>
</body>
</html>
